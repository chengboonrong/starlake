<!doctype html>
<!-- Holds the scene at exactly #w x #h: headless Chrome reports a shorter window than it screenshots. -->
<body style="margin:0"><iframe style="border:0;display:block"></iframe>
<script>
const f = document.querySelector('iframe'), p = new URLSearchParams(location.hash.slice(1));
f.style.width = p.get('w') + 'px'; f.style.height = p.get('h') + 'px';
f.src = '../index.html' + location.hash;
</script>
