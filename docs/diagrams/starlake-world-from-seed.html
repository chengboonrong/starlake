<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starlake builds its landscape from one seed</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f6f3ec;
      --color-ink:     #0c1739;
      --color-muted:   #3e5389;
      --color-accent:  #c8781a;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree · Starlake</p>
    <h1>Starlake builds its landscape from one seed</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="starlake-world-from-seed-title starlake-world-from-seed-desc">
        <title id="starlake-world-from-seed-title">Starlake builds its landscape from one seed</title>
        <desc id="starlake-world-from-seed-desc">Tree showing one seed producing the terrain heights, the night sky, and the foreground, with the terrain heights choosing the cabin site and filling the per-pixel layer map.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3e5389"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c8781a"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e66a8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f6f3ec"/>
<path d="M 480 128 V 208" fill="none" stroke="#3e5389" stroke-width="1"/>
<path d="M 480 168 H 248 A 8 8 0 0 0 240 176 V 208" fill="none" stroke="#3e5389" stroke-width="1"/>
<path d="M 480 168 H 712 A 8 8 0 0 1 720 176 V 208" fill="none" stroke="#3e5389" stroke-width="1"/>
<path d="M 240 256 V 296" fill="none" stroke="#3e5389" stroke-width="1"/>
<path d="M 240 296 H 148 A 8 8 0 0 0 140 304 V 336" fill="none" stroke="#3e5389" stroke-width="1"/>
<path d="M 240 296 H 332 A 8 8 0 0 1 340 304 V 336" fill="none" stroke="#3e5389" stroke-width="1"/>
<rect x="400" y="80" width="160" height="48" rx="6" fill="#f6f3ec"/>
<rect x="400" y="80" width="160" height="48" rx="6" fill="rgba(62,83,137,0.10)" stroke="#6c7eb4" stroke-width="1"/>
<text x="480" y="102" fill="#0c1739" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Seed</text>
<text x="480" y="116" fill="#3e5389" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rng() · noise() · fbm()</text>
<rect x="160" y="208" width="160" height="48" rx="6" fill="#f6f3ec"/>
<rect x="160" y="208" width="160" height="48" rx="6" fill="#ffffff" stroke="#0c1739" stroke-width="1"/>
<text x="240" y="230" fill="#0c1739" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Terrain heights</text>
<text x="240" y="244" fill="#3e5389" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">far · mid · near ridges</text>
<rect x="400" y="208" width="160" height="48" rx="6" fill="#f6f3ec"/>
<rect x="400" y="208" width="160" height="48" rx="6" fill="#ffffff" stroke="#0c1739" stroke-width="1"/>
<text x="480" y="230" fill="#0c1739" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Night sky</text>
<text x="480" y="244" fill="#3e5389" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Milky Way + stars</text>
<rect x="640" y="208" width="160" height="48" rx="6" fill="#f6f3ec"/>
<rect x="640" y="208" width="160" height="48" rx="6" fill="#ffffff" stroke="#0c1739" stroke-width="1"/>
<text x="720" y="230" fill="#0c1739" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Foreground</text>
<text x="720" y="244" fill="#3e5389" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reeds · fireflies</text>
<rect x="60" y="336" width="160" height="48" rx="6" fill="#f6f3ec"/>
<rect x="60" y="336" width="160" height="48" rx="6" fill="#ffffff" stroke="#0c1739" stroke-width="1"/>
<text x="140" y="358" fill="#0c1739" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cabin site</text>
<text x="140" y="372" fill="#3e5389" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">flattest hill spot</text>
<rect x="260" y="336" width="160" height="48" rx="6" fill="#f6f3ec"/>
<rect x="260" y="336" width="160" height="48" rx="6" fill="rgba(200,120,26,0.10)" stroke="#c8781a" stroke-width="1"/>
<text x="340" y="358" fill="#0c1739" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Layer map</text>
<text x="340" y="372" fill="#3e5389" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lay · face · ridge</text>
<path d="M 456 358 Q 440 358 426 360" fill="none" stroke="rgba(12,23,57,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
<circle cx="423" cy="360" r="2" fill="#0c1739"/>
<text x="464" y="354" fill="#0c1739" font-size="14" font-family="'Instrument Serif', 'Noto Serif', serif" font-style="italic">Stores what each pixel is, not its color.</text>
<text x="464" y="374" fill="#0c1739" font-size="14" font-family="'Instrument Serif', 'Noto Serif', serif" font-style="italic">The color is worked out again every frame.</text>
<line x1="40" y1="464" x2="920" y2="464" stroke="rgba(12,23,57,0.10)" stroke-width="0.8"/>
<text x="40" y="484" fill="#3e5389" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="496" width="16" height="12" rx="2" fill="rgba(62,83,137,0.10)" stroke="#6c7eb4" stroke-width="1"/>
<text x="64" y="506" fill="#3e5389" font-size="9" font-family="'Geist', sans-serif">Input</text>
<rect x="180" y="496" width="16" height="12" rx="2" fill="#ffffff" stroke="#0c1739" stroke-width="1"/>
<text x="204" y="506" fill="#3e5389" font-size="9" font-family="'Geist', sans-serif">Built once from the seed</text>
<rect x="380" y="496" width="16" height="12" rx="2" fill="rgba(200,120,26,0.10)" stroke="#c8781a" stroke-width="1"/>
<text x="404" y="506" fill="#3e5389" font-size="9" font-family="'Geist', sans-serif">Focal: read every frame</text>
      </svg>
    </div>
  </div>
</body>
</html>
